                 ext: [py, pyw, pyi, js, mjs, cjs, jsx, tsx, dart, java, kt, kts, swift, go, rs, c, h, cpp, cxx, hpp, hh,
                       cc, cs, vb, fs, php, rb, lua, r, rmd, scala, groovy, gradle, pl, pm, ex, exs, erl, hs, clj, zig,
                       nim, sol, vue, svelte, astro, html, htm, css, scss, sass, less, styl, cmake, mk, ino, ts, cts, m,
                       mm, hbs, handlebars, ejs, pug, jade, twig, jinja, jinja2, j2, liquid, mustache, njk, razor,
                       cshtml, http, rest]}
notebook:       {group: dev, en: Notebook, id: Notebook, ext: [ipynb, rmarkdown, qmd, nb, wl, mlx]}
script:         {group: dev, en: Script & automation, id: Script & otomasi,
                 ext: [bat, cmd, ps1, psm1, psd1, sh, bash, zsh, fish, vbs, vbe, wsf, ahk, au3, reg, applescript, scpt,
                       command]}
