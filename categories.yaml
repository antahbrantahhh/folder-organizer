# ─────────────────────────────────────────────────────────────
# Library kategori file — Folder Organizer
# Dipakai di rules.yaml lewat:   category: cad_mech      atau   category: [photo_raw, image]
# Setiap ekstensi hanya ada di SATU kategori, supaya hasil aturan bisa ditebak.
# Ekstensi ambigu diputuskan ke arah yang lebih aman: .key = kunci (bukan Keynote), .asc = PGP, .env = rahasia.
# .ts = TypeScript (bukan video MPEG-TS; video kamera memakai .mts/.m2ts).
# names: nama file utuh tanpa ekstensi (mis. Dockerfile, README, .env), tidak peka huruf besar/kecil.
# Kategori sendiri / tambahan ekstensi: tulis di rules.yaml → categories: (lihat contoh di sana).
# ─────────────────────────────────────────────────────────────

# ── Dokumen ──
pdf:            {group: documents, en: PDF, id: PDF, ext: [pdf]}
word:           {group: documents, en: Word processor, id: Pengolah kata,
                 ext: [doc, docx, docm, dot, dotx, dotm, odt, ott, rtf, wpd, wps, pages, hwp]}
text:           {group: documents, en: Plain text & Markdown, id: Teks & Markdown,
                 ext: [txt, md, markdown, mdx, rst, adoc, asciidoc, org, tex, bib, nfo, text],
                 names: [readme, license, licence, changelog, authors, contributors, contributing, notice, copying, todo]}
spreadsheet:    {group: documents, en: Spreadsheet, id: Spreadsheet,
                 ext: [xls, xlsx, xlsm, xlsb, xlt, xltx, xltm, ods, ots, csv, tsv, numbers, gsheet]}
presentation:   {group: documents, en: Presentation, id: Presentasi,
                 ext: [ppt, pptx, pptm, pps, ppsx, pot, potx, potm, odp, otp, gslides]}
ebook:          {group: documents, en: E-book & comics, id: E-book & komik,
                 ext: [epub, mobi, azw, azw3, kfx, fb2, djvu, ibooks, cbz, cbr, cb7, lit]}
note:           {group: documents, en: Notes app exports, id: Ekspor aplikasi catatan,
                 ext: [one, onetoc2, enex, notebook, gdoc]}
email:          {group: documents, en: E-mail & mailbox, id: E-mail & mailbox,
                 ext: [eml, msg, mbox, emlx, pst, ost, oft]}
calendar_contact: {group: documents, en: Calendar & contacts, id: Kalender & kontak,
                 ext: [ics, ical, ifb, vcs, vcf, vcard]}
form_publishing: {group: documents, en: Publishing & forms, id: Publikasi & formulir,
                 ext: [pub, xps, oxps, fdf, xfdf, indd, idml, qxp]}

# ── Gambar & desain ──
photo:          {group: media, en: Camera photo, id: Foto kamera, ext: [jpg, jpeg, jpe, jfif, heic, heif, hif]}
photo_raw:      {group: media, en: RAW photo, id: Foto RAW,
                 ext: [dng, cr2, cr3, crw, nef, nrw, arw, srf, sr2, orf, rw2, raf, pef, srw, x3f, 3fr, iiq, rwl, erf, mrw, raw]}
image:          {group: media, en: Image & graphic, id: Gambar & grafis,
                 ext: [png, gif, webp, bmp, dib, tif, tiff, ico, icns, avif, jxl, jp2, tga, pcx, apng, exr, hdr, dds]}
vector:         {group: design, en: Vector graphic, id: Grafis vektor, ext: [svg, svgz, eps, ai, cdr, emf, wmf, cgm]}
design_source:  {group: design, en: Design source file, id: File sumber desain,
                 ext: [psd, psb, fig, jam, sketch, xd, afdesign, afphoto, afpub, kra, xcf, procreate, clip, sai, ora,
                       pdn, cpt, riv, lottie, aep, prproj, drp, fcpxml, veg, kdenlive, mlt]}
font:           {group: design, en: Font, id: Font, ext: [ttf, otf, woff, woff2, eot, fon, fnt, pfb, pfm, ttc, otc]}

# ── Video & audio ──
video:          {group: media, en: Video, id: Video,
                 ext: [mp4, m4v, mov, mkv, avi, wmv, webm, flv, f4v, mpg, mpeg, m2v, 3gp, 3g2, mts, m2ts, vob, ogv, rm,
                       rmvb, asf, divx, mxf, insv, braw, r3d]}
subtitle:       {group: media, en: Subtitle, id: Subtitle, ext: [srt, vtt, ass, ssa, sub, idx, sbv, smi, ttml]}
audio:          {group: media, en: Audio, id: Audio,
                 ext: [mp3, wav, m4a, m4b, flac, aac, ogg, oga, opus, wma, aiff, aif, aifc, alac, amr, ape, wv, mka, au,
                       caf, dsf, dff, mid, midi]}
audio_project:  {group: media, en: Music/audio project, id: Proyek musik/audio,
                 ext: [als, flp, logicx, aup, aup3, ptx, cpr, rpp, band, sesx, reason, song, mmpz]}
playlist:       {group: media, en: Playlist, id: Playlist, ext: [m3u, m3u8, pls, xspf, wpl, cue]}

# ── Arsip, image disk, installer ──
archive:        {group: archive, en: Archive, id: Arsip,
                 ext: [zip, rar, 7z, tar, gz, tgz, bz2, tbz2, xz, txz, zst, lz, lz4, lzma, cab, arj, z, ace, sitx, sit,
                       zipx, wim]}
