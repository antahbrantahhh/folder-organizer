                 ext: [iso, img, vhd, vhdx, vmdk, vdi, dmg, qcow2, ova, ovf, bin, nrg, mdf, mds, toast]}
installer_windows: {group: software, en: Windows installer, id: Installer Windows,
                 ext: [exe, msi, msix, msixbundle, appx, appxbundle, msp, msu]}
installer_mobile:  {group: software, en: Mobile app package, id: Paket aplikasi mobile, ext: [apk, aab, xapk, apks, apkm, ipa]}
installer_other:   {group: software, en: Mac/Linux installer, id: Installer Mac/Linux,
                 ext: [pkg, mpkg, deb, rpm, appimage, flatpakref, snap, run]}
dev_package:    {group: software, en: Developer package & extension, id: Paket developer & ekstensi,
                 ext: [whl, jar, war, ear, nupkg, gem, crx, xpi, vsix, unitypackage, aar, egg]}
torrent:        {group: software, en: Torrent, id: Torrent, ext: [torrent, magnet]}

