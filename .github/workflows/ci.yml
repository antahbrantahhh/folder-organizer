# CI: tests on Windows + Linux (incl. GUI), Windows .exe + installer build, GitHub Release on tag v*.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.10"     # minimum supported version
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install
        run: python -m pip install -r requirements.lock pytest==9.2.0 pyflakes==4.1.0
      - name: Lint
        run: python -m pyflakes organizer.py rules_io.py i18n.py updates.py version.py gui tests
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests (Linux, with GUI)
        if: runner.os == 'Linux'
        env: { RUN_GUI_TESTS: "1" }
        run: xvfb-run -a python -m pytest -q tests
      - name: Tests (Windows, with GUI)
        if: runner.os == 'Windows'
        env: { RUN_GUI_TESTS: "1" }
        run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install
        run: python -m pip install -r requirements.lock
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean folder_organizer.spec
      - name: Smoke test exe (starts and exits with --version)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Folder Organizer\Folder Organizer.exe" -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
      - name: Version
        id: ver
        shell: pwsh
        run: echo "v=$(python -c 'from version import __version__; print(__version__)')" >> $env:GITHUB_OUTPUT
      - name: Sign exe
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD "dist\Folder Organizer\Folder Organizer.exe"
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer\folder_organizer.iss
      - name: Sign installer
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem installer\Output\*.exe | ForEach-Object { & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD $_.FullName }
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\Folder Organizer" -DestinationPath "FolderOrganizer-${{ steps.ver.outputs.v }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: folder-organizer-${{ steps.ver.outputs.v }}
          path: |
            installer/Output/*.exe
            FolderOrganizer-*-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/**/*.exe
            out/**/*.zip
          generate_release_notes: true
