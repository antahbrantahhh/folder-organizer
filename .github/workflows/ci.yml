# CI: tests on Windows + Linux (incl. GUI), Windows .exe + installer build, GitHub Release on tag v*.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.11"     # minimum supported version (3.10 is end-of-life)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install
        run: python -m pip install -r requirements.lock pytest==9.2.0 pyflakes==3.4.0
      - name: Lint
        run: python -m pyflakes organizer.py rules_io.py i18n.py updates.py version.py gui tests
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests (Linux, with GUI)
        if: runner.os == 'Linux'
        env: { RUN_GUI_TESTS: "1" }
        run: xvfb-run -a python -m pytest -q tests
      - name: Tests (Windows, with GUI)
        if: runner.os == 'Windows'
        env: { RUN_GUI_TESTS: "1" }
        run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install
        run: python -m pip install -r requirements.lock
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean folder_organizer.spec
      - name: Smoke test exe (starts and exits with --version)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Folder Organizer\Folder Organizer.exe" -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          $p = Start-Process -FilePath "dist\Folder Organizer\Folder Organizer.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "exe self-test failed" }
          Remove-Item "dist\Folder Organizer\rules.yaml" -ErrorAction SilentlyContinue  # created by the self-test
      - name: Version
        id: ver
        shell: pwsh
        run: echo "v=$(python -c 'from version import __version__; print(__version__)')" >> $env:GITHUB_OUTPUT
      - name: Sign exe
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD "dist\Folder Organizer\Folder Organizer.exe"
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer\folder_organizer.iss
      - name: Sign installer
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem installer\Output\*.exe | ForEach-Object { & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD $_.FullName }
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      - name: Smoke test installed app (silent install → self-test → update path → uninstall)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Output\FolderOrganizer-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "fo-install"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\_internal\rules.yaml")) { throw "default rules.yaml missing from install" }
          if (-not (Test-Path "$dir\_internal\categories.yaml")) { throw "categories.yaml missing from install" }
          $p = Start-Process "$dir\Folder Organizer.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:APPDATA\FolderOrganizer\logs\app.log" -Tail 20; throw "installed app self-test failed" }
          if (-not (Test-Path "$dir\rules.yaml")) { throw "rules.yaml was not created on first run" }
          Get-Content "$env:APPDATA\FolderOrganizer\logs\app.log" -Tail 3
          # In-app update path: app running, installer run with the updater's arguments over it
          Add-Content "$dir\rules.yaml" "# user edit marker"
          $app = Start-Process "$dir\Folder Organizer.exe" -PassThru
          Start-Sleep -Seconds 6
          $log = Join-Path $env:RUNNER_TEMP "update-install.log"
          # not -Wait: it also waits for child processes, and the installer relaunches the app as its child
          $p = Start-Process $setup.FullName -ArgumentList "/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CLOSEAPPLICATIONS", "/RELAUNCH=1", "/DIR=`"$dir`"", "/LOG=`"$log`"" -PassThru
          if (-not $p.WaitForExit(300000)) { Get-Content $log -Tail 40; throw "update install timed out" }
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "update install exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 6
          $procs = @(Get-CimInstance Win32_Process -Filter "Name='Folder Organizer.exe'")
          $procs | ForEach-Object { "running: $($_.ProcessId) $($_.CommandLine)" }
          $relaunched = $procs | Where-Object { $_.CommandLine -like '*--updated*' }
          $procs | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if (-not $relaunched) { Get-Content $log -Tail 40; throw "app was not relaunched after update" }
          if (-not (Select-String -Path "$dir\rules.yaml" -Pattern "user edit marker" -Quiet)) { throw "user rules.yaml overwritten by update" }
          Start-Sleep -Seconds 2
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\Folder Organizer" -DestinationPath "FolderOrganizer-${{ steps.ver.outputs.v }}-portable.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: folder-organizer-${{ steps.ver.outputs.v }}
          path: |
            installer/Output/*.exe
            FolderOrganizer-*-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/**/*.exe
            out/**/*.zip
          generate_release_notes: true
