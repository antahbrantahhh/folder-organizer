# ─────────────────────────────────────────────────────────────
# FILE RULES
# ─────────────────────────────────────────────────────────────
rules:
  # ── 1. Sensitive & personal (at the top so they do not end up in Photos/Documents) ──
  - name: Identity documents
    name_regex: "(?<![a-z])(ktp|e-?ktp|npwp|kartu.?keluarga|akta|ijazah|paspor|passport|bpjs|kitas|sim.?[abc])(?![a-z])"
    category: [pdf, word, photo, image]
    dest: "Areas/Personal/Identity"

  - name: Keys, certificates & vaults
    category: keys_certs
    dest: "Areas/Personal/Keys"

  # ── 2. Finance ──
  - name: Invoices & receipts
    name_regex: "(?<![a-z])(invoice|inv|faktur|kwitansi|kuitansi|receipt|nota|tagihan|billing)(?![a-z])"
    category: [pdf, photo, image, spreadsheet]
    dest: "Areas/Finance/Invoices/{period}"

  - name: Bank statements & payslips
    name_regex: "e-?statement|rekening|mutasi.?rek|slip.?gaji|payslip|spt.?tahunan|bukti.?potong"
    category: [pdf, spreadsheet]
    dest: "Areas/Finance/Statements/{period}"

  # ── 3. New downloads: leave them for now (so a just-downloaded installer/zip does not vanish) ──
  - name: Recent installers & archives (keep)
    category: [installer_windows, installer_mobile, installer_other, archive, disk_image]
    newer_than_days: 7
    dest: "."

  # ── 4. Software & archives ──
  - name: Installers
    category: [installer_windows, installer_mobile, installer_other]
    dest: "_Archive/Installers"

  - name: Archives
    category: archive
    dest: "_Archive/Compressed/{period}"

  - name: Disk images & VMs
    category: disk_image
    dest: "_Archive/Disk Images"

  - name: Developer packages
    category: dev_package
    dest: "Resources/Packages"

  - name: Torrents
    category: torrent
    dest: "_Archive/Torrents"

  # ── 5. Documents ──
  - name: School material
    name_regex: "BS-KLS|buku.?(siswa|guru)|modul.?ajar|(?<![a-z])(lks|rpp)(?![a-z])"
    category: [pdf, word, presentation]
    dest: "Resources/School/{period}"

  - name: E-books
    category: ebook
    dest: "Resources/Books"

  - name: Spreadsheets
    category: spreadsheet
    dest: "Documents/Spreadsheets/{period}"

  - name: Presentations
    category: presentation
    dest: "Documents/Presentations/{period}"

  - name: Documents
    category: [pdf, word, form_publishing]
    dest: "Documents/{period}"

  - name: Notes & text
    category: [text, note]
    dest: "Documents/Notes/{period}"

  - name: E-mail
    category: email
    dest: "Documents/Email/{period}"

  - name: Calendar & contacts
    category: calendar_contact
    dest: "Documents/Calendar & Contacts"

  - name: Saved web pages
    category: web_archive
    dest: "Documents/Web Pages/{period}"

  # ── 6. Images & media ──
  - name: Screenshots
    name_regex: "^(screenshot|screen shot|cuplikan layar|snip|capture|screencapture|scr_)"
    category: [image, photo]
    dest: "Media/Screenshots/{period}"

  - name: RAW photos
    category: photo_raw
    dest: "Media/Photos/RAW/{period}"

  - name: Camera & phone photos
    name_regex: "^(img|dsc|dscn|dscf|pxl|p_|vid|dcim|mvimg)[_-]?\\d|^whatsapp (image|video)|^photo[_-]?\\d|^\\d{8}_\\d{6}"
    category: photo
    dest: "Media/Photos/{period}"

  - name: HEIC photos
    ext: [heic, heif, hif]
    dest: "Media/Photos/{period}"

  - name: Images & graphics
    category: [image, photo]
    dest: "Media/Images/{period}"

  - name: Videos & subtitles
    category: [video, subtitle]
    dest: "Media/Videos/{period}"

  - name: Audio
    category: [audio, playlist]
    dest: "Media/Audio"

  - name: Audio projects
    category: audio_project
    dest: "Media/Audio Projects"

  # ── 7. Design ──
  - name: Design files
    category: [vector, design_source]
    dest: "Resources/Design"

  - name: Fonts
    category: font
    dest: "Resources/Fonts"

  # ── 8. Engineering ──
  - name: CAD
    category: cad_mech
    dest: "Resources/CAD"

  - name: 3D models & print files
    category: model_3d
    dest: "Resources/3D Models"

  - name: BIM & GIS
    category: bim_gis
    dest: "Resources/BIM & GIS"

  - name: Simulation & analysis
    category: engineering_sim
    dest: "Resources/Engineering"

  - name: Electronics & PCB
    category: electronics
    dest: "Resources/Electronics"

  # ── 9. Developer ──
  - name: Code, scripts & notebooks
    category: [code, script, notebook, config]
    dest: "Resources/Code"

  - name: Data & databases
    category: [data, database]
    dest: "Resources/Data"

  # ── 10. System ──
  - name: Logs & crash dumps
    category: log
    dest: "_Archive/Logs/{period}"

  - name: Backups & old copies
    category: backup
    dest: "_Archive/Backups"

  - name: Shortcuts & links (keep)
    category: shortcut
    dest: "."
