# ─────────────────────────────────────────────────────────────
# Folder Organizer rules (v3.10)
# Rules are checked TOP to BOTTOM — the first matching rule wins.
# So the most specific rules (identity, finance) are at the top, general categories below.
#
# File rule conditions (all optional, combined with AND):
#   category:         cad_mech  /  [photo, image]   category from the library (categories.yaml, 44 categories)
#   ext:              [pdf, docx]                   extra extensions outside the categories
#   name_regex:       "invoice|faktur"              file name regex (case-insensitive)
#   older_than_days / newer_than_days / min_size_mb / max_size_mb
#   enabled: false                                  turn a rule off without deleting it
# No category & no ext = every file type.
#
# Destination (dest): relative to the target folder. Placeholders: {period} {year} {month} {day} {ext} {EXT}
#   {period} = date folder following date_format below (default "2026-10").
#   dest: "."  = leave in place (useful for files you just downloaded).
#
# The pattern "(?<![a-z])word(?![a-z])" means a whole word. Used instead of \b because \b fails on names
# like "invoice_tokopedia.pdf" (an underscore counts as a letter).
# ─────────────────────────────────────────────────────────────

# false = only files at the top level (safe for Downloads/Desktop)
recursive: false

# Folders/files that are never touched (glob patterns, relative to the target folder)
exclude:
  - "Projects/**"
  - "WORK"            # container folder: moving it would nest it (Projects/WORK/...)
  - "REPOS"
  - "*.lnk"           # Desktop shortcuts

# Files that match no rule go here. Set to null to leave them in place.
fallback_dest: "_Inbox/_Review"

# Date folder format for {period}. Date = EXIF for photos, otherwise the file's last-modified date.
#   "{year}"                → 2026
#   "{year}-{month}"        → 2026-10        (default)
#   "{year}/{month}"        → 2026/10        (nested)
#   "{year}/{year}-{month}" → 2026/2026-10
date_format: "{year}-{month}"

# ─────────────────────────────────────────────────────────────
# CUSTOM CATEGORIES (optional) — add to or change the library categories
#   name: [ext, ...]                         → add extensions to a built-in category, or create a new one
#   name: {ext: [...], replace: true}        → replace a built-in category's extensions entirely
#   name: {ext: [...], en: "...", id: "..."} → new category with labels
# ─────────────────────────────────────────────────────────────
categories: {}
#  cad_mech: [scdoc]                               # example: add .scdoc (SpaceClaim) to the CAD category
#  training_certificates: {ext: [pdf], en: "Training certificates", id: "Sertifikat pelatihan"}

# ─────────────────────────────────────────────────────────────
# FOLDER RULES — move top-level folders (with everything inside)
# Conditions: name_regex, older_than_days, newer_than_days
# Folder age = the most recent change INSIDE the folder (not just the folder's own date).
# Always skipped: dot-folders, folders created by the organizer, folders in 'exclude',
# junctions/symlinks, application-owned folders, and this app's own folder. Not run in watch mode.
# ─────────────────────────────────────────────────────────────
folder_rules:
  - name: Leftover extracts & downloads
    name_regex: "^(files|archive|download|downloads|new folder|untitled|extracted|unzipped)\\s*(\\(\\d+\\))?$|^today$"
    dest: "_Inbox/_Review/Folders"

  - name: Extracted tools & portable apps
    name_regex: "-(win(dows|32|64)?|x64|x86|amd64|arm64|portable)([-.]|$)|^node-v\\d"
    dest: "_Archive/Tools"

  - name: Prototypes & demos
    name_regex: "^(protot[iy]pe|demo)(?![a-z])|-html$"
    dest: "Projects/_Prototypes"

  - name: Design systems
    name_regex: "design.?system|^dsg(?![a-z])"
    dest: "Resources/Design Systems"

  # Example: recognize your projects by name. Put your own project names in the regex, then enable it.
  - name: Known projects
    enabled: false
    name_regex: "^(project-a|project-b|client-)"
    dest: "Projects"

  - name: Old folders (no changes > 180 days)
    older_than_days: 180
    dest: "_Archive/Folders/{period}"

# Folders that match no folder rule go here. Default null = leave in place.
# Safe for Documents (many app-owned folders). For Downloads you could set e.g. "Projects".
folder_fallback: null

# ─────────────────────────────────────────────────────────────
# FOLDER INFO — folder descriptions, written by the Folder labels page
#   • Shown as a tooltip when hovering the folder in Explorer (desktop.ini → InfoTip)
#   • Plus a _README.txt inside the folder (turn off with folder_info_readme: false)
#   • Plain text, or {en: ..., id: ...} — the app writes the language it is set to.
# ─────────────────────────────────────────────────────────────
folder_info_readme: true

